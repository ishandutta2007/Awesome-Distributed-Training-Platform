<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#60a5fa" stop-opacity=".8"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".2"/></linearGradient><filter id="neon-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulse-node{0%{r:6px;opacity:.6;filter:drop-shadow(0 0 4px #3b82f6)}50%{r:9px;opacity:1;filter:drop-shadow(0 0 12px #8b5cf6)}}@keyframes float-pill{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes bg-glow-pulse{0%{opacity:.25;transform:scale(1)}50%{opacity:.45;transform:scale(1.08)}}.bg-shape{transform-origin:center;animation:bg-glow-pulse 8s ease-in-out infinite}.node{animation:pulse-node 3s ease-in-out infinite}.node-delay-1{animation-delay:.6s}.node-delay-2{animation-delay:1.2s}.node-delay-3{animation-delay:1.8s}.node-delay-4{animation-delay:2.4s}.data-stream{stroke-dasharray:12,12;animation:dash-flow 3s linear infinite}.data-stream-reverse{stroke-dasharray:10,10;animation:dash-flow 4s linear infinite reverse}.pill{animation:float-pill 4s ease-in-out infinite}.pill-delay-1{animation-delay:1.5s}.pill-delay-2{animation-delay:2.5s}.banner-subtitle,.banner-title,.pill-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.banner-title{font-weight:800;font-size:44px;fill:#fff;letter-spacing:-.5px}.banner-subtitle{font-weight:500;font-size:18px;fill:#94a3b8}.pill-text{font-weight:600;font-size:13px;fill:#e2e8f0}</style><rect width="1200" height="400" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" rx="16"/><circle cx="200" cy="100" r="180" fill="url(#glow-grad)" class="bg-shape" opacity=".25"/><circle cx="1000" cy="300" r="220" fill="url(#glow-grad)" class="bg-shape" opacity=".25" style="animation-delay:-4s"/><g stroke="#fff" stroke-width="1" opacity=".08"><path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200"/><path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400"/></g><g opacity=".35"><line x1="150" x2="350" y1="320" y2="280" stroke="#3b82f6" stroke-width="2" class="data-stream"/><line x1="350" x2="550" y1="280" y2="340" stroke="#8b5cf6" stroke-width="2" class="data-stream-reverse"/><line x1="550" x2="780" y1="340" y2="290" stroke="#ec4899" stroke-width="2" class="data-stream"/><line x1="780" x2="1050" y1="290" y2="330" stroke="#3b82f6" stroke-width="2" class="data-stream-reverse"/><line x1="350" x2="480" y1="280" y2="210" stroke="#60a5fa" stroke-dasharray="4 4" stroke-width="1.5"/><line x1="780" x2="920" y1="290" y2="220" stroke="#a855f7" stroke-dasharray="4 4" stroke-width="1.5"/><circle cx="150" cy="320" r="7" fill="#60a5fa" class="node"/><circle cx="350" cy="280" r="7" fill="#8b5cf6" class="node node-delay-1"/><circle cx="550" cy="340" r="7" fill="#ec4899" class="node node-delay-2"/><circle cx="780" cy="290" r="7" fill="#3b82f6" class="node node-delay-3"/><circle cx="1050" cy="330" r="7" fill="#a855f7" class="node node-delay-4"/><circle cx="480" cy="210" r="5" fill="#38bdf8" class="node node-delay-2"/><circle cx="920" cy="220" r="5" fill="#f472b6" class="node node-delay-1"/></g><g class="pill" transform="translate(80, 50)"><rect width="180" height="34" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity=".9" rx="17"/><circle cx="18" cy="17" r="5" fill="#10b981" filter="url(#soft-glow)"/><text x="32" y="22" class="pill-text">⚡ Multi-GPU Clusters</text></g><g class="pill pill-delay-1" transform="translate(930, 60)"><rect width="190" height="34" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" opacity=".9" rx="17"/><circle cx="18" cy="17" r="5" fill="#6366f1" filter="url(#soft-glow)"/><text x="32" y="22" class="pill-text">🚀 Distributed MLOps</text></g><g class="pill pill-delay-2" transform="translate(960, 240)"><rect width="165" height="34" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" opacity=".9" rx="17"/><circle cx="18" cy="17" r="5" fill="#ec4899" filter="url(#soft-glow)"/><text x="32" y="22" class="pill-text">🔥 Fault Tolerance</text></g><rect width="1200" height="6" x="0" y="0" fill="url(#primary-grad)"/><g transform="translate(60, 160)"><rect width="220" height="26" x="0" y="0" fill="url(#primary-grad)" opacity=".2" rx="6"/><rect width="220" height="26" x="0" y="0" fill="none" stroke="#60a5fa" stroke-width="1" rx="6"/><text x="12" y="17" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED AI INFRASTRUCTURE</text><text x="0" y="75" class="banner-title" filter="url(#neon-glow)">Awesome Distributed Training Platform</text><text x="0" y="115" class="banner-subtitle">Multi-GPU Orchestration • Cluster Scheduling • Fault-Tolerant Training • Open-Source &amp; Enterprise SaaS</text></g></svg>